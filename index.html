<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #ecece4;
            font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            padding: 28px 24px 48px;
            line-height: 1.5;
            color: #2c3e2f;
            transition: background 0.2s, color 0.2s;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .top-header {
            background: #fefaf5;
            border-radius: 32px;
            padding: 12px 24px;
            margin-bottom: 16px;
            border: 1px solid #e2dcd0;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            position: relative;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo {
            font-size: 1.65rem;
            font-weight: 620;
            color: #4f6b4a;
            letter-spacing: -0.2px;
            user-select: none;
            display: flex;
            align-items: center;
        }
        .logo .editable {
            cursor: pointer;
            border-bottom: 2px dotted transparent;
            transition: border-color 0.2s;
            position: relative;
        }
        .logo .editable:hover {
            border-bottom-color: #6e8c6a;
        }
        .logo .editable::after {
            content: "✎";
            font-size: 0.7rem;
            color: #b2aa98;
            margin-left: 4px;
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        .logo .editable:hover::after {
            opacity: 1;
        }
        .logo .fixed-part {
            color: #6e8c6a;
        }
        .custom-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            color: #6f6a5c;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 50%;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .custom-btn:hover {
            background: #f3efe8;
            color: #3b5a37;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .huangli-btn {
            background: #f3efe8;
            border: 1px solid #e2dcd0;
            border-radius: 60px;
            padding: 4px 14px;
            font-size: 0.8rem;

            align-items: center;
            gap: 4px;

        }
        .huangli-btn i {
            font-size: 0.9rem;
        }
        .huangli-btn:hover {
            background: #e8e0d4;
            border-color: #bcb09b;
        }
        .calc-date-btn {
            background: #f3efe8;
            border: 1px solid #e2dcd0;
            border-radius: 60px;
            padding: 4px 14px;
            font-size: 0.8rem;
            cursor: pointer;
            color: #4a5a45;
            transition: 0.2s;
            white-space: nowrap;
        }
        .calc-date-btn:hover {
            background: #e8e0d4;
            border-color: #bcb09b;
        }
        .date-calc-popup {
            position: absolute;
            top: 60px;
            right: 24px;
            background: #fefaf5;
            border-radius: 28px;
            padding: 16px 20px;
            border: 1px solid #e2dcd0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);

            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: center;
        }
        .date-calc-popup.show {
            display: flex;
        }
        .date-calc-popup .calc-item {
            display: flex;
            align-items: center;
            gap: 4px;

            color: #4a5a45;

            white-space: nowrap;
        }

            border: 1px solid #d9d0c0;
            border-radius: 40px;
            padding: 4px 10px;
            font-size: 0.8rem;
            outline: none;
            background: white;
            width: 120px;
            color: #2c3e2f;
        }

        }

            color: #b2aa98;

        }
        .calc-buttons {
            display: flex;
            gap: 6px;
        }
        .btn-calc,

            border: none;
            border-radius: 40px;
            padding: 4px 14px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-calc {
            background: #6e8c6a;
            color: white;
        }
        .btn-clear {
            background: #e6dfd4;
            color: #4a5a45;
        }
        .btn-calc:hover {
            background: #5c7858;
        }
        .btn-clear:hover {
            background: #d5cdbe;
        }
        .email-select-wrapper select {
            background: #f3efe8;
            border: 1px solid #e2dcd0;
            border-radius: 60px;
            padding: 6px 16px 6px 20px;
            font-size: 0.85rem;
            color: #4a5a45;
            cursor: pointer;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
            padding-right: 36px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="8" viewBox="0 0 12 8"><path fill="%236f6a5c" d="M6 8L0 0h12z"/></svg>');
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 12px 8px;
            min-width: 120px;
        }
        .email-select-wrapper select:hover {
            border-color: #bcb09b;
        }
        .toolbar {
            background: #fefaf5;
            border-radius: 60px;
            padding: 8px 16px;
            margin-bottom: 24px;
            border: 1px solid #e2dcd0;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }
        .search-bar {
            flex: 2;
            min-width: 260px;
            display: flex;
            align-items: center;
            background: #ffffff;
            border-radius: 60px;
            border: 2.5px solid #6e8c6a;
            padding: 4px 4px 4px 20px;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(110, 140, 106, 0.15);
            transition: all 0.25s ease;
        }
        .search-bar:hover {
            border-color: #5c7858;
            box-shadow: 0 4px 20px rgba(110, 140, 106, 0.25);
        }
        .search-bar:focus-within {
            border-color: #3b5a37;
            box-shadow: 0 0 0 4px rgba(110, 140, 106, 0.2), 0 4px 24px rgba(110, 140, 106, 0.3);
        }
        .search-bar select {
            border: none;
            background: transparent;
            font-size: 0.9rem;
            font-weight: 500;
            color: #4a5a45;
            cursor: pointer;
            outline: none;
            padding: 8px 4px;
            border-right: 1px solid #d9d0c0;
            padding-right: 12px;
        }
        .search-bar input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 12px 0;
            font-size: 1.05rem;
            outline: none;
            color: #2c3e2f;
            min-width: 100px;
            font-weight: 500;
        }
        .search-bar input::placeholder {
            color: #b2aa98;
            font-weight: 400;
        }
        .search-bar button {
            background: #6e8c6a;
            border: none;
            color: white;
            padding: 10px 26px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.25s;
            white-space: nowrap;
            letter-spacing: 0.3px;
        }
        .search-bar button:hover {
            background: #5c7858;
            transform: scale(1.02);
        }
        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .sort-buttons {
            display: flex;
            gap: 8px;
        }
        .sort-btn {
            background: #fefaf5;
            border: 1px solid #d9d0c0;
            padding: 6px 14px;
            border-radius: 60px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #4a5a45;
        }
        .sort-btn.active {
            background: #6e8c6a;
            color: white;
            border-color: #6e8c6a;
        }
        .sort-btn:hover {
            background: #e6dfd4;
            border-color: #bcb09b;
        }
        .operations-dropdown {
            position: relative;
            display: inline-block;
        }
        .operations-btn {
            background: #fefaf5;
            border: 1px solid #d9d0c0;
            padding: 6px 14px;
            border-radius: 60px;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #4a5a45;
            transition: 0.2s;
        }
        .operations-btn:hover {
            background: #f3efe8;
        }
        .operations-dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 42px;
            background: #fefaf5;
            border-radius: 24px;
            padding: 8px 0;
            border: 1px solid #e2dcd0;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            z-index: 100;
            min-width: 180px;
        }
        .operations-dropdown-content.show {
            display: block;
        }
        .operations-dropdown-content button {
            display: block;
            width: 100%;
            background: none;
            border: none;
            padding: 8px 24px;
            font-size: 0.8rem;
            cursor: pointer;
            text-align: left;
            color: #4a5a45;
            transition: 0.1s;
        }
        .operations-dropdown-content button:hover {
            background: #f3efe8;
        }
        .operations-dropdown-content .divider {
            border-top: 1px solid #e2dcd0;
            margin: 4px 0;
        }
        .tag-manager {
            background: #fefaf5;
            border-radius: 32px;
            padding: 12px 20px;
            margin-bottom: 24px;
            border: 1px solid #e2dcd0;
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: space-between;
        }
        .tag-list-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
            flex: 1;
        }
        .tag-list {
            display: flex;
            flex-wrap: nowrap;
            gap: 10px;
            align-items: center;
            overflow: hidden;
        }
        .tag-list.expanded {
            flex-wrap: wrap;
        }
        .tag-item {
            background: #f3efe8;
            border-radius: 60px;
            padding: 5px 16px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid #e2dcd0;
            transition: 0.2s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .tag-item.active {
            background: #6e8c6a;
            color: white;
            border-color: #6e8c6a;
        }
        .tag-item .edit-tag,
        .tag-item .del-tag {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.65rem;
            color: inherit;
            opacity: 0.6;
            transition: 0.2s;
        }
        .tag-item .edit-tag:hover,
        .tag-item .del-tag:hover {
            opacity: 1;
        }
        .tag-expand-btn {
            background: #f3efe8;
            border: 1px solid #e2dcd0;
            border-radius: 60px;
            padding: 5px 10px;
            font-size: 0.8rem;
            cursor: pointer;
            color: #4a5a45;
            flex-shrink: 0;
            display: none;
        }
        .tag-actions {
            flex-shrink: 0;
        }
        .tag-actions .btn-tag {
            background: #f3efe8;
            border: 1px solid #d9d0c0;
            padding: 5px 14px;
            border-radius: 60px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .tag-actions .btn-tag:hover {
            background: #e6dfd4;
        }
        .backup-section {
            background: #fefaf5;
            border-radius: 32px;
            padding: 12px 20px;
            margin-top: 28px;
            border: 1px solid #e2dcd0;
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 10px;
        }
        .backup-inner {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            flex: 1;
        }
        .backup-inner.expanded {
            flex-wrap: wrap;
        }
        .cloud-backup,
        .local-backup {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f3efe8;
            padding: 4px 12px;
            border-radius: 60px;
            flex-shrink: 0;
        }
        .cloud-backup input {
            border: 1px solid #d9d0c0;
            border-radius: 60px;
            padding: 4px 10px;
            font-size: 0.75rem;
            width: 120px;
            outline: none;
            background: white;
            color: #2c3e2f;
        }
        .cloud-backup button,
        .local-backup button {
            background: white;
            border: 1px solid #d9d0c0;
            padding: 4px 10px;
            border-radius: 60px;
            cursor: pointer;
            font-size: 0.7rem;
            transition: 0.2s;
            color: #4a5a45;
            white-space: nowrap;
        }
        .cloud-backup button:hover,
        .local-backup button:hover {
            background: #e6dfd4;
        }
        .random-key-btn {
            background: #f3efe8;
            border: none;
            padding: 4px 8px;
            border-radius: 60px;
            font-size: 0.7rem;
            cursor: pointer;
        }
        .backup-expand-btn {
            background: #f3efe8;
            border: 1px solid #e2dcd0;
            border-radius: 60px;
            padding: 5px 10px;
            font-size: 0.8rem;
            cursor: pointer;
            color: #4a5a45;
            flex-shrink: 0;
            display: none;
        }
        .edit-mode-bar {
            display: none;
        }
        .sites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
            gap: 20px;
            margin: 16px 0 8px;
        }
        .card {
            background: #ffffff;
            border-radius: 28px;
            padding: 14px 20px;
            border: 1px solid #ece3d8;
            transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }
        .card:hover {
            transform: translateY(-2px);

            border-color: #cfc5b4;
            background: #fffefa;
        }
        .card.selected {
            background: #eef5ea;

            box-shadow: 0 0 0 2px #8caa87 inset;
        }
        .card.highlight {
            background: #fff0e0;
            border-left: 4px solid #c47b5e;
        }
        .drag-handle {
            cursor: grab;
            color: #b6aa94;
            font-size: 1rem;
            flex-shrink: 0;
        }
        .site-name-link {
            font-weight: 600;
            color: #2d4630;
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .site-name-link:hover {
            color: #6e8c6a;
            text-decoration: underline;
        }
        .site-tag-select {
            background: #f3efe8;
            border: 1px solid #e2dcd0;
            border-radius: 40px;
            padding: 4px 10px;
            font-size: 0.7rem;
            outline: none;
            cursor: pointer;
            flex-shrink: 0;
            color: #3b5a37;
        }
        .empty-state {

            background: #fefaf5;
            border-radius: 48px;
            color: #b2aa98;
            border: 1px dashed #ddd2c2;
        }
        .toast-msg {
            position: fixed;
            bottom: 28px;
            right: 28px;
            background: #2d3e2a;
            color: #fefaf5;
            padding: 12px 24px;
            border-radius: 60px;
            font-size: 0.85rem;
            z-index: 1000;
            opacity: 0;
            transition: 0.2s;
            pointer-events: none;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.1);
        }
        .toast-msg.show {
            opacity: 1;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(44, 62, 47, 0.4);
            backdrop-filter: blur(2px);
            align-items: center;
            justify-content: center;
            z-index: 1050;
        }
        .modal-content {
            background: #fefaf5;
            border-radius: 40px;
            max-width: 520px;
            width: 90%;
            padding: 28px;
            border: 1px solid #e2dcd0;
            box-shadow: 0 30px 40px -20px rgba(0, 0, 0, 0.2);
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content h3 {
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 18px;
        }
        .input-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #6f6a5c;
            display: block;
            margin-bottom: 6px;
        }
        .input-group input[type="text"],
        .input-group input[type="number"],
        .input-group input[type="color"] {
            width: 100%;

        .modal-buttons {

        }
        .btn-secondary {
            background: #f3efe8;

            border-radius: 60px;

        }
        .btn-secondary:hover {

        .btn-primary:hover {

        @media (max-width: 680px) {

                        <button class="btn-secondary" id="resetApiKeyBtn" style="padding:4px 16px; font-size:0.75rem;"><i class="fas fa-undo"></i> 重置密钥</button>

                    </div>

                        如需使用自己的密钥，请在 <a href="https://api.t1qq.com/user/key" target="_blank" style="color:#6e8c6a;">api.t1qq.com</a> 申请
                    </div>

    <script>
        (function() {
            let sites = [];
            let tags = [];
            let editId = null;
            let sortableInstance = null;
            let currentSearchKeyword = "";
            let currentTagId = "all";
            let editMode = false;
            let deleteMode = false;
            let selectedIds = new Set();
            let currentSort = 'frequency';
            let clickCounts = {};

            const STORAGE_KEY = 'tender_nav_pro_sites';
            const TAGS_KEY = 'tender_nav_tags';
            const CLICK_COUNT_KEY = 'tender_nav_click_counts';
            const TITLE_KEY = 'tender_nav_title';
            const CUSTOM_STYLE_KEY = 'tender_nav_custom_style';
            const API_KEY_KEY = 'tender_nav_api_key';

            const DEFAULT_API_KEY = 'txxvS89xaHq8BZ3RwAjxKcFB0S';
            const defaultCustom = {
                bgColor: '#ecece4',
                textColor: '#2c3e2f',
                fontSize: 15,
                title: '投标'
            };

            let calendarData = null;
            let searchDebounceTimer = null;

            function getCustomFontSize() {
                try {
                    const stored = localStorage.getItem(CUSTOM_STYLE_KEY);
                    if (stored) {
                        const custom = JSON.parse(stored);
                        if (custom && typeof custom.fontSize === 'number' && custom.fontSize >= 10 && custom.fontSize <=
                            30) {
                            return custom.fontSize;
                        }
                    }
                } catch (e) {}
                return defaultCustom.fontSize;
            }

            function parseTitleUrl(text) {
                const urlMatch = text.match(/(https?:\/\/[^\s]+)/);
                if (!urlMatch) return { title: text.trim(), url: '' };
                const url = urlMatch[0];
                let titlePart = text.substring(0, urlMatch.index).trim();
                if (!titlePart) titlePart = text.substring(urlMatch.index + url.length).trim();
                titlePart = titlePart.replace(/[\|\-—–]\s*$/, '').trim();
                if (!titlePart) {
                    try { titlePart = new URL(url).hostname.replace(/^www\./, ''); } catch (e) { titlePart = url; }
                }
                return { title: titlePart, url: url };
            }

            function getApiKey() {
                const userKey = localStorage.getItem(API_KEY_KEY);
                if (userKey && userKey.trim() && /^[A-Za-z0-9]+$/.test(userKey.trim()) && userKey.trim().length > 10) {
                    return userKey.trim();
                }
                return DEFAULT_API_KEY;
            }

            function isUsingCustomKey() {
                const userKey = localStorage.getItem(API_KEY_KEY);
                return !!(userKey && userKey.trim() && /^[A-Za-z0-9]+$/.test(userKey.trim()) && userKey.trim().length > 10);
            }

            function getMaskedKey(key) {
                if (!key) return '未设置';
                if (key.length <= 8) return key;
                return key.substring(0, 4) + '****' + key.substring(key.length - 4);
            }

            function loadCustomStyle() {
                const stored = localStorage.getItem(CUSTOM_STYLE_KEY);
                if (stored) {
                    try {
                        const custom = JSON.parse(stored);
                        for (let key in defaultCustom) {
                            if (!(key in custom)) custom[key] = defaultCustom[key];
                        }
                        applyCustomStyle(custom);
                        return custom;
                    } catch (e) { return { ...defaultCustom }; }
                } else {
                    applyCustomStyle(defaultCustom);
                    return { ...defaultCustom };
                }
            }

            function applyCustomStyle(custom) {
                document.body.style.backgroundColor = custom.bgColor || defaultCustom.bgColor;
                document.body.style.color = custom.textColor || defaultCustom.textColor;
                const fontSize = (custom.fontSize || defaultCustom.fontSize) + 'px';
                document.querySelectorAll('.site-name-link').forEach(el => el.style.fontSize = fontSize);
                const titleEl = document.getElementById('editableTitle');
                if (titleEl && custom.title) titleEl.textContent = custom.title;
                localStorage.setItem(TITLE_KEY, custom.title || '投标');
            }

            function saveCustomStyle(custom) {
                localStorage.setItem(CUSTOM_STYLE_KEY, JSON.stringify(custom));
                applyCustomStyle(custom);
                localStorage.setItem(TITLE_KEY, custom.title || '投标');
            }

            function resetCustomStyle() {
                saveCustomStyle({ ...defaultCustom });
                applyCustomStyle({ ...defaultCustom });
                document.getElementById('customTitle').value = defaultCustom.title;
                document.getElementById('customBgColor').value = defaultCustom.bgColor;
                document.getElementById('customBgColorText').value = defaultCustom.bgColor;
                document.getElementById('customTextColor').value = defaultCustom.textColor;
                document.getElementById('customTextColorText').value = defaultCustom.textColor;
                document.getElementById('customFontSize').value = defaultCustom.fontSize;
                showToast('已恢复默认样式', 1500);
            }

            function openCustomModal() {
                const current = loadCustomStyle();
                document.getElementById('customTitle').value = current.title || '投标';
                document.getElementById('customBgColor').value = current.bgColor || '#ecece4';
                document.getElementById('customBgColorText').value = current.bgColor || '#ecece4';
                document.getElementById('customTextColor').value = current.textColor || '#2c3e2f';
                document.getElementById('customTextColorText').value = current.textColor || '#2c3e2f';
                document.getElementById('customFontSize').value = current.fontSize || 15;
                updateKeyStatusUI();
                document.getElementById('customModal').style.display = 'flex';
            }

            function closeCustomModal() {
                document.getElementById('customModal').style.display = 'none';
            }

            function updateKeyStatusUI() {
                const statusText = document.getElementById('keyStatusText');
                const dot = document.querySelector('#keyStatus .dot');
                const currentKey = getApiKey();
                if (isUsingCustomKey()) {
                    statusText.textContent = `当前使用：自定义密钥 (${getMaskedKey(currentKey)})`;
                    dot.className = 'dot custom';
                } else {
                    statusText.textContent = `当前使用：默认密钥 (${getMaskedKey(currentKey)})`;
                    dot.className = 'dot default';
                }
            }

            function resetApiKey() {
                localStorage.removeItem(API_KEY_KEY);
                updateKeyStatusUI();
                showToast('已重置为默认密钥', 1500);
            }

            function loadTitle() {
                const saved = localStorage.getItem(TITLE_KEY);
                if (saved) document.getElementById('editableTitle').textContent = saved;
            }

            function saveTitle(newTitle) {
                localStorage.setItem(TITLE_KEY, newTitle);
                document.getElementById('editableTitle').textContent = newTitle;
            }

            function clearDateFields() {
                document.getElementById('startDate').value = '';
                document.getElementById('endDate').value = '';
                document.getElementById('diffDays').value = '';
            }

            function calcDate() {
                const start = document.getElementById('startDate');
                const end = document.getElementById('endDate');
                const diff = document.getElementById('diffDays');
                const startVal = start.value,
                    endVal = end.value,
                    diffVal = diff.value;
                let filled = (startVal ? 1 : 0) + (endVal ? 1 : 0) + (diffVal ? 1 : 0);
                if (filled < 2) { showToast('请至少输入两项才能计算', 1500); return; }
                if (filled === 3 && startVal && endVal) {
                    const d1 = new Date(startVal),
                        d2 = new Date(endVal);
                    if (!isNaN(d1) && !isNaN(d2)) {
                        diff.value = Math.round(Math.abs(d2 - d1) / (1000 * 60 * 60 * 24));
                        showToast('计算完成', 1200);
                        return;
                    }
                }
                if (startVal && endVal) {
                    const d1 = new Date(startVal),
                        d2 = new Date(endVal);
                    if (!isNaN(d1) && !isNaN(d2)) {
                        diff.value = Math.round(Math.abs(d2 - d1) / (1000 * 60 * 60 * 24));
                        showToast('计算完成', 1200);
                    } else showToast('日期格式无效', 1500);
                } else if (startVal && diffVal) {
                    const d1 = new Date(startVal),
                        days = parseInt(diffVal);
                    if (!isNaN(d1) && !isNaN(days) && days >= 0) {
                        const d2 = new Date(d1);
                        d2.setDate(d2.getDate() + days);
                        end.value = d2.toISOString().split('T')[0];
                        showToast(`结束日期 ${end.value}`, 1200);
                    } else showToast('天数无效', 1500);
                } else if (endVal && diffVal) {
                    const d2 = new Date(endVal),
                        days = parseInt(diffVal);
                    if (!isNaN(d2) && !isNaN(days) && days >= 0) {
                        const d1 = new Date(d2);
                        d1.setDate(d1.getDate() - days);
                        start.value = d1.toISOString().split('T')[0];
                        showToast(`开始日期 ${start.value}`, 1200);
                    } else showToast('天数无效', 1500);
                } else showToast('请至少输入两项', 1500);
            }

            async function fetchLunarData() {
                const key = getApiKey();
                try {
                    const resp = await fetch(
                        `https://api.t1qq.com/api/tool/day/time?key=${encodeURIComponent(key)}`);
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                    const data = await resp.json();
                    if (data.code === 200 && data.data) {
                        calendarData = data.data;
                    }
                } catch (err) {
                    console.warn('黄历数据预加载失败:', err.message);
                }
            }

            function showCalendar() {
                const modal = document.getElementById('calendarModal');
                const content = document.getElementById('calendarContent');
                modal.style.display = 'flex';
                content.innerHTML = '<div style="text-align:center; padding:20px;">加载中...</div>';
                if (!getApiKey()) { content.innerHTML =
                        '<div style="text-align:center;color:#c47b5e;padding:20px;">密钥无效</div>'; return; }
                if (calendarData) { renderCalendarContent(calendarData); return; }
                fetch(`https://api.t1qq.com/api/tool/day/time?key=${encodeURIComponent(getApiKey())}`)
                    .then(r => r.json())
                    .then(data => {
                        if (data.code === 200 && data.data) { calendarData = data.data;
                            renderCalendarContent(data.data); } else content.innerHTML =
                            '<div style="text-align:center;color:#c47b5e;padding:20px;">获取失败</div>';
                    })
                    .catch(() => content.innerHTML =
                        '<div style="text-align:center;color:#c47b5e;padding:20px;">网络错误</div>');
            }

            function renderCalendarContent(data) {
                const content = document.getElementById('calendarContent');
                const yi = data.luckyDay?.yi || [],
                    ji = data.luckyDay?.ji || [];
                content.innerHTML = `
                    <div class="calendar-header">
                        <span><strong>📅 公历</strong> ${data.solar||'--'}</span>
                        <span><strong>🌙 农历</strong> ${data.lunar||'--'}</span>
                        <span><strong>🐾 生肖</strong> ${data.zodiac||'--'}</span>
                    </div>

            async function importBookmarks(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = e => {
                        const doc = new DOMParser().parseFromString(e.target.result, 'text/html');
                        const links = doc.querySelectorAll('a');
                        const existing = new Set(sites.map(s => s.url));
                        const newSites = [];
                        links.forEach(a => {
                            let href = a.getAttribute('href');
                            if (!href || !href.startsWith('http')) return;
                            let title = a.textContent?.trim() || new URL(href).hostname;
                            if (!existing.has(href)) {
                                newSites.push({ id: Date.now() + Math.random(), name: title.substring(0,
                                        100), url: href, tagId: tags[0]?.id || 'tag_default' });
                                existing.add(href);
                            }
                        });
                        resolve(newSites);
                    };
                    reader.onerror = () => reject();
                    reader.readAsText(file);
                });
            }

            async function handleImport(file) {
                if (!file) return;
                try {
                    const imported = await importBookmarks(file);
                    if (imported.length) { sites.push(...imported);
                        saveToLocal();
                        applySortAndRender();
                        showToast(`导入 ${imported.length} 个`); } else showToast('无新链接');
                } catch (e) { showToast('解析失败'); }
            }

            const MAX_VALUE_SIZE = 200000;
            async function writeTextDB(key, value) {
                const resp = await fetch(
                    `https://textdb.online/update/?key=${encodeURIComponent(key)}&value=${encodeURIComponent(value)}`, {
                        method: 'POST' });
                if (!resp.ok) throw new Error('网络错误');
                const json = await resp.json();
                if (json.status !== 1) throw new Error('API失败');
            }
            async function readTextDB(key) {
                const resp = await fetch(`https://textdb.online/${encodeURIComponent(key)}`);
                return resp.ok ? await resp.text() : null;
            }

            async function backupToCloud() {
                const key = document.getElementById('cloudKey').value.trim();
                if (!/^[0-9a-zA-Z\-_]{6,60}$/.test(key)) { showToast('KEY无效', 3000); return; }
                const data = JSON.stringify({ sites, tags, clickCounts });
                const btn = document.getElementById('backupToCloudBtn');
                btn.disabled = true;
                btn.innerHTML = '备份中...';
                try {
                    if (data.length <= MAX_VALUE_SIZE) await writeTextDB(key, data);
                    else {
                        const chunks = Math.ceil(data.length / 180000);
                        await writeTextDB(key, JSON.stringify({ batches: chunks }));
                        for (let i = 0; i < chunks; i++) await writeTextDB(`${key}_batch${i}`, data.substring(i *
                            180000, (i + 1) * 180000));
                    }
                    showToast('✅ 云端备份成功');
                } catch (e) { showToast('备份失败');
                    backupToLocal(); } finally { btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-upload"></i> 分片备份'; }
            }

            async function restoreFromCloud() {
                const key = document.getElementById('cloudKey').value.trim();
                if (!/^[0-9a-zA-Z\-_]{6,60}$/.test(key)) { showToast('KEY无效', 3000); return; }
                const btn = document.getElementById('restoreFromCloudBtn');
                btn.disabled = true;
                btn.innerHTML = '恢复中...';
                try {
                    let master = await readTextDB(key);
                    if (!master) { showToast('云端无数据'); return; }
                    let fullData = '';
                    if (master.includes('"batches"')) {
                        const meta = JSON.parse(master);
                        const parts = [];
                        for (let i = 0; i < meta.batches; i++) parts.push(await readTextDB(
                            `${key}_batch${i}`));
                        fullData = parts.join('');
                    } else fullData = master;
                    const restored = JSON.parse(fullData);
                    if (restored.sites && restored.tags) {
                        if (confirm('覆盖当前数据？')) {
                            sites = restored.sites;
                            tags = restored.tags; if (restored.clickCounts) clickCounts = restored.clickCounts;
                            saveToLocal();
                            saveClickCounts();
                            renderTagBar();
                            applySortAndRender();
                            showToast('已恢复');
                        }
                    }
                } catch (e) { showToast('恢复失败'); } finally { btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-download"></i> 分片恢复'; }
            }

                document.getElementById('calcDateBtn').addEventListener('click', calcDate);
                document.getElementById('clearDateBtn').addEventListener('click', clearDateFields);

                document.getElementById('globalSearchInput').addEventListener('input', handleSearchInput);
                document.getElementById('engineSearchBtn').addEventListener('click', () => {
                    const kw = document.getElementById('globalSearchInput').value.trim();
                    if (kw) performWebSearch(kw);
                });
                document.getElementById('sortByNameBtn').addEventListener('click', () => { currentSort = 'name';
                    clearSearch(); });
                document.getElementById('sortByFreqBtn').addEventListener('click', () => { currentSort = 'frequency';
                    clearSearch(); });
                document.getElementById('operationsBtn').addEventListener('click', e => {
                    e.stopPropagation();
                    document.getElementById('operationsDropdown').classList.toggle('show');
                });
                document.addEventListener('click', () => document.getElementById('operationsDropdown').classList.remove(
                    'show'));
                document.getElementById('editModeBtnMenu').addEventListener('click', () => { editMode ? exitEditMode() :
                    enterEditMode(); });
                document.getElementById('deleteModeBtnMenu').addEventListener('click', () => { deleteMode ? (selectedIds
                    .size ? confirmDeleteSelected() : exitDeleteMode()) : enterDeleteMode(); });
                document.getElementById('importFileInput').addEventListener('change', e => { if (e.target.files[0])
                        handleImport(e.target.files[0]); });
                document.getElementById('openAddSiteModalBtnMenu').addEventListener('click', openAddModal);
                document.getElementById('clearAllSitesBtnMenu').addEventListener('click', clearAllSites);
                document.getElementById('sortByNameBtnMenu').addEventListener('click', () => { currentSort = 'name';
                    clearSearch(); });
                document.getElementById('sortByFreqBtnMenu').addEventListener('click', () => { currentSort = 'frequency';
                    clearSearch(); });

                document.getElementById('closeModalBtn').addEventListener('click', closeAddModal);
                document.getElementById('modalAddSiteBtn').addEventListener('click', addSiteFromModal);
                document.getElementById('modalAddUrl').addEventListener('paste', function(e) {
                    const pasted = (e.clipboardData || window.clipboardData).getData('text');
                    const parsed = parseTitleUrl(pasted);
                    if (parsed.url) {
                        this.value = parsed.url;
                        if (!document.getElementById('modalAddName').value.trim()) document.getElementById(
                            'modalAddName').value = parsed.title;
                        e.preventDefault();
                    }
                });
                document.getElementById('closeEditModalBtn').addEventListener('click', closeEditModal);
                document.getElementById('saveEditBtn').addEventListener('click', saveEdit);
                document.getElementById('manageTagsBtn').addEventListener('click', showManageTags);
                document.getElementById('closeManageTagsBtn').addEventListener('click', () => document.getElementById(
                    'manageTagsModal').style.display = 'none');
                document.getElementById('tagExpandBtn').addEventListener('click', toggleTagExpand);
                document.getElementById('backupToCloudBtn').addEventListener('click', backupToCloud);
                document.getElementById('restoreFromCloudBtn').addEventListener('click', restoreFromCloud);
                document.getElementById('genRandomKeyBtn').addEventListener('click', generateRandomKey);
                document.getElementById('backupToLocalBtn').addEventListener('click', backupToLocal);
                document.getElementById('restoreFromLocalBtn').addEventListener('click', triggerLocalRestore);
                document.getElementById('localRestoreFile').addEventListener('change', e => { if (e.target.files[0])
                        handleLocalRestore(e.target.files[0]); });
                document.getElementById('backupExpandBtn').addEventListener('click', toggleBackupExpand);
                document.getElementById('emailSelect').addEventListener('change', function() { if (this.value) window.open(
                        this.value, '_blank'); });
                window.addEventListener('resize', () => { checkTagOverflow();
                    checkBackupOverflow(); });
                window.addEventListener('click', e => {
                    if (e.target === document.getElementById('editModal')) closeEditModal();
                    if (e.target === document.getElementById('manageTagsModal')) document.getElementById(
                        'manageTagsModal').style.display = 'none';
                    if (e.target === document.getElementById('customModal')) closeCustomModal();
                    if (e.target === document.getElementById('calendarModal')) closeCalendar();
                });
                setTimeout(() => { checkTagOverflow();
                    checkBackupOverflow(); }, 100);
            }

            (async function init() {
                await initData();
                bindEvents();
                sortSitesBy(currentSort);
                renderTagBar();
                renderSites();
            })();
        })();
    </script>
</body>
</html>
