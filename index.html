<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>导航|可个性改造为专属导航·云端备份</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js">
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #ecece4;
            font-family: system-ui, -apple-system, 'Segoe UI', 'Roboto', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            padding: 28px 24px 48px;
            line-height: 1.5;
            color: #2c3e2f;
            transition: background 0.2s, color 0.2s;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .top-header {
            background: #fefaf5; border-radius: 32px; padding: 12px 24px; margin-bottom: 16px;
            border: 1px solid #e2dcd0; display: flex; flex-wrap: wrap; align-items: center;
            justify-content: space-between; gap: 12px; position: relative;
        }
        .header-left {
            display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
        }
        .logo-area {
            display: flex; align-items: center; gap: 8px;
        }
        .logo {
            font-size: 1.65rem; font-weight: 620; color: #4f6b4a; letter-spacing: -0.2px;
            user-select: none; display: flex; align-items: center;
        }
        .logo .editable {
            cursor: pointer; border-bottom: 2px dotted transparent;
            transition: border-color 0.2s; position: relative;
        }
        .logo .editable:hover { border-bottom-color: #6e8c6a; }
        .logo .editable::after {
            content: "✎"; font-size: 0.7rem; color: #b2aa98;
            margin-left: 4px; opacity: 0.5; transition: opacity 0.2s;
        }
        .logo .editable:hover::after { opacity: 1; }
        .logo .fixed-part { color: #6e8c6a; }
        .custom-btn {
            background: none; border: none; font-size: 1.2rem;
            color: #6f6a5c; cursor: pointer; padding: 4px 6px;
            border-radius: 50%; transition: 0.2s;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .custom-btn:hover { background: #f3efe8; color: #3b5a37; }
        .header-right {
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
        }
        .huangli-btn {
            background: #f3efe8; border: 1px solid #e2dcd0; border-radius: 60px;
            padding: 4px 14px; font-size: 0.8rem; cursor: pointer; color: #4a5a45;
            display: flex; align-items: center; gap: 4px; transition: 0.2s;
        }
        .huangli-btn i { font-size: 0.9rem; }
        .huangli-btn:hover { background: #e8e0d4; border-color: #bcb09b; }
        .calc-date-btn {
            background: #f3efe8; border: 1px solid #e2dcd0; border-radius: 60px;
            padding: 4px 14px; font-size: 0.8rem; cursor: pointer; color: #4a5a45;
            transition: 0.2s; white-space: nowrap;
        }
        .calc-date-btn:hover { background: #e8e0d4; border-color: #bcb09b; }
        .date-calc-popup {
            position: absolute; top: 60px; right: 24px; background: #fefaf5;
            border-radius: 28px; padding: 16px 20px; border: 1px solid #e2dcd0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); z-index: 50; display: none;
            flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center;
        }
        .date-calc-popup.show { display: flex; }
        .date-calc-popup .calc-item { display: flex; align-items: center; gap: 4px; font-size: 0.8rem; color: #4a5a45; }
        .date-calc-popup .calc-item label { white-space: nowrap; }
        .date-calc-popup .calc-item input {
            border: 1px solid #d9d0c0; border-radius: 40px; padding: 4px 10px;
            font-size: 0.8rem; outline: none; background: white; width: 120px; color: #2c3e2f;
        }
        .date-calc-popup .calc-item input[type="number"] { width: 80px; }
        .date-calc-popup .calc-divider { color: #b2aa98; font-size: 0.8rem; }
        .calc-buttons { display: flex; gap: 6px; }
        .btn-calc, .btn-clear {
            border: none; border-radius: 40px; padding: 4px 14px;
            font-size: 0.75rem; font-weight: 500; cursor: pointer; transition: 0.2s;
        }
        .btn-calc { background: #6e8c6a; color: white; }
        .btn-clear { background: #e6dfd4; color: #4a5a45; }
        .btn-calc:hover { background: #5c7858; }
        .btn-clear:hover { background: #d5cdbe; }
        .email-select-wrapper select {
            background: #f3efe8; border: 1px solid #e2dcd0; border-radius: 60px;
            padding: 6px 16px 6px 20px; font-size: 0.85rem; color: #4a5a45;
            cursor: pointer; outline: none; appearance: none; -webkit-appearance: none;
            padding-right: 36px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="8" viewBox="0 0 12 8"><path fill="%236f6a5c" d="M6 8L0 0h12z"/></svg>');
            background-repeat: no-repeat; background-position: right 12px center; background-size: 12px 8px;
            min-width: 120px;
        }
        .email-select-wrapper select:hover { border-color: #bcb09b; }
        .toolbar {
            background: #fefaf5; border-radius: 60px; padding: 8px 16px; margin-bottom: 24px;
            border: 1px solid #e2dcd0; display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
        }
        .search-bar {
            flex: 2; min-width: 260px; display: flex; align-items: center;
            background: #ffffff; border-radius: 60px; border: 2.5px solid #6e8c6a;
            padding: 4px 4px 4px 20px; gap: 8px; box-shadow: 0 4px 14px rgba(110,140,106,0.15);
            transition: all 0.25s ease;
        }
        .search-bar:hover { border-color: #5c7858; box-shadow: 0 4px 20px rgba(110,140,106,0.25); }
        .search-bar:focus-within { border-color: #3b5a37; box-shadow: 0 0 0 4px rgba(110,140,106,0.2), 0 4px 24px rgba(110,140,106,0.3); }
        .search-bar select {
            border: none; background: transparent; font-size: 0.9rem; font-weight: 500; color: #4a5a45;
            cursor: pointer; outline: none; padding: 8px 4px; border-right: 1px solid #d9d0c0; padding-right: 12px;
        }
        .search-bar input {
            flex: 1; border: none; background: transparent; padding: 12px 0; font-size: 1.05rem;
            outline: none; color: #2c3e2f; min-width: 100px; font-weight: 500;
        }
        .search-bar input::placeholder { color: #b2aa98; font-weight: 400; }
        .search-bar button {
            background: #6e8c6a; border: none; color: white; padding: 10px 26px;
            border-radius: 60px; font-weight: 600; font-size: 0.95rem; cursor: pointer;
            transition: 0.25s; white-space: nowrap; letter-spacing: 0.3px;
        }
        .search-bar button:hover { background: #5c7858; transform: scale(1.02); }
        .toolbar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .sort-buttons { display: flex; gap: 8px; }
        .sort-btn {
            background: #fefaf5; border: 1px solid #d9d0c0; padding: 6px 14px; border-radius: 60px;
            font-size: 0.8rem; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px; color: #4a5a45;
        }
        .sort-btn.active { background: #6e8c6a; color: white; border-color: #6e8c6a; }
        .sort-btn:hover { background: #e6dfd4; border-color: #bcb09b; }
        .operations-dropdown {
            position: relative; display: inline-block;
        }
        .operations-btn {
            background: #fefaf5; border: 1px solid #d9d0c0; padding: 6px 14px; border-radius: 60px;
            font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; gap: 6px; color: #4a5a45;
            transition: 0.2s;
        }
        .operations-btn:hover { background: #f3efe8; }
        .operations-dropdown-content {
            display: none; position: absolute; right: 0; top: 42px; background: #fefaf5;
            border-radius: 24px; padding: 8px 0; border: 1px solid #e2dcd0;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1); z-index: 100; min-width: 180px;
        }
        .operations-dropdown-content.show { display: block; }
        .operations-dropdown-content button {
            display: block; width: 100%; background: none; border: none; padding: 8px 24px;
            font-size: 0.8rem; cursor: pointer; text-align: left; color: #4a5a45; transition: 0.1s;
        }
        .operations-dropdown-content button:hover { background: #f3efe8; }
        .operations-dropdown-content .divider { border-top: 1px solid #e2dcd0; margin: 4px 0; }
        .tag-manager {
            background: #fefaf5; border-radius: 32px; padding: 12px 20px; margin-bottom: 24px;
            border: 1px solid #e2dcd0; display: flex; align-items: center; gap: 12px; justify-content: space-between;
        }
        .tag-list-wrapper { display: flex; align-items: center; gap: 8px; overflow: hidden; flex: 1; }
        .tag-list { display: flex; flex-wrap: nowrap; gap: 10px; align-items: center; overflow: hidden; }
        .tag-list.expanded { flex-wrap: wrap; }
        .tag-item {
            background: #f3efe8; border-radius: 60px; padding: 5px 16px; font-size: 0.8rem; font-weight: 500;
            cursor: pointer; border: 1px solid #e2dcd0; transition: 0.2s; white-space: nowrap;
            display: flex; align-items: center; gap: 6px; flex-shrink: 0;
        }
        .tag-item.active { background: #6e8c6a; color: white; border-color: #6e8c6a; }
        .tag-item .edit-tag, .tag-item .del-tag { background: none; border: none; cursor: pointer; font-size: 0.65rem; color: inherit; opacity: 0.6; transition: 0.2s; }
        .tag-item .edit-tag:hover, .tag-item .del-tag:hover { opacity: 1; }
        .tag-expand-btn {
            background: #f3efe8; border: 1px solid #e2dcd0; border-radius: 60px; padding: 5px 10px;
            font-size: 0.8rem; cursor: pointer; color: #4a5a45; flex-shrink: 0; display: none;
        }
        .tag-actions { flex-shrink: 0; }
        .tag-actions .btn-tag {
            background: #f3efe8; border: 1px solid #d9d0c0; padding: 5px 14px; border-radius: 60px;
            font-size: 0.75rem; cursor: pointer; transition: 0.2s;
        }
        .tag-actions .btn-tag:hover { background: #e6dfd4; }
        .backup-section {
            background: #fefaf5; border-radius: 32px; padding: 12px 20px; margin-top: 28px;
            border: 1px solid #e2dcd0; display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
        }
        .backup-inner {
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap; flex: 1;
        }
        .cloud-backup, .local-backup {
            display: flex; align-items: center; gap: 6px; background: #f3efe8; padding: 4px 12px; border-radius: 60px;
            flex-shrink: 0; flex-wrap: wrap;
        }
        .cloud-backup input {
            border: 1px solid #d9d0c0; border-radius: 60px; padding: 4px 10px; font-size: 0.75rem; width: 120px;
            outline: none; background: white; color: #2c3e2f;
        }
        .cloud-backup button, .local-backup button {
            background: white; border: 1px solid #d9d0c0; padding: 4px 10px; border-radius: 60px;
            cursor: pointer; font-size: 0.7rem; transition: 0.2s; color: #4a5a45; white-space: nowrap;
        }
        .cloud-backup button:hover, .local-backup button:hover { background: #e6dfd4; }
        .random-key-btn {
            background: #f3efe8; border: none; padding: 4px 8px; border-radius: 60px; font-size: 0.7rem; cursor: pointer;
        }
        .backup-expand-btn { display: none; }
        .edit-mode-bar { display: none; }
        .sites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
            gap: 20px;
            margin: 16px 0 8px;
        }
        .card {
            background: #ffffff; border-radius: 28px; padding: 14px 20px; border: 1px solid #ece3d8;
            transition: all 0.2s cubic-bezier(0.2, 0, 0, 1);
            display: flex; align-items: center; gap: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            overflow: visible; position: relative; min-width: 0;
        }
        .card:hover { transform: translateY(-2px); box-shadow: 0 12px 22px -12px rgba(0,0,0,0.1); border-color: #cfc5b4; background: #fffefa; }
        .card.selected { background: #eef5ea; border-color: #8caa87; box-shadow: 0 0 0 2px #8caa87 inset; }
        .card.highlight { background: #fff0e0; border-left: 4px solid #c47b5e; }
        .drag-handle { cursor: grab; color: #b6aa94; font-size: 1rem; flex-shrink: 0; }
        .site-name-link {
            font-weight: 600; color: #2d4630; text-decoration: none;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
            font-size: inherit; min-width: 0;
        }
        .site-name-link:hover { color: #6e8c6a; text-decoration: underline; }
        .site-tag-select {
            background: #f3efe8; border: 1px solid #e2dcd0; border-radius: 40px;
            padding: 4px 10px; font-size: 0.7rem; outline: none; cursor: pointer; flex-shrink: 0; color: #3b5a37;
            max-width: 100px;
        }
        .delete-x-btn {
            position: absolute;
            top: -6px;
            left: -6px;
            width: 26px;
            height: 26px;
            background: #d35c4a;
            color: #fff;
            border: none;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            transition: 0.2s;
        }
        .delete-x-btn:hover { background: #b84535; transform: scale(1.1); }
        .card.deletable .delete-x-btn { display: flex; }
        .empty-state { text-align: center; padding: 56px 20px; background: #fefaf5; border-radius: 48px; color: #b2aa98; border: 1px dashed #ddd2c2; }
        .toast-msg { position: fixed; bottom: 28px; right: 28px; background: #2d3e2a; color: #fefaf5; padding: 12px 24px; border-radius: 60px; font-size: 0.85rem; z-index: 1000; opacity: 0; transition: 0.2s; pointer-events: none; box-shadow: 0 6px 14px rgba(0,0,0,0.1); }
        .toast-msg.show { opacity: 1; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(44,62,47,0.4); backdrop-filter: blur(2px); align-items: center; justify-content: center; z-index: 1050; }
        .modal-content { background: #fefaf5; border-radius: 40px; max-width: 520px; width: 90%; padding: 28px; border: 1px solid #e2dcd0; box-shadow: 0 30px 40px -20px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; }
        .modal-content h3 { margin-bottom: 20px; }
        .input-group { margin-bottom: 18px; }
        .input-group label { font-size: 0.8rem; font-weight: 600; color: #6f6a5c; display: block; margin-bottom: 6px; }
        .input-group input[type="text"], .input-group input[type="number"], .input-group input[type="color"] {
            width: 100%; padding: 10px 14px; border-radius: 28px; border: 1px solid #e2dcd0; background: white; font-size: 0.9rem; outline: none; transition: 0.2s;
        }
        .input-group input[type="color"] { padding: 4px; height: 44px; cursor: pointer; }
        .input-group .color-row { display: flex; gap: 12px; align-items: center; }
        .input-group .color-row input[type="color"] { flex: 0 0 60px; }
        .input-group .color-row input[type="text"] { flex: 1; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 14px; margin-top: 24px; flex-wrap: wrap; }
        .btn-secondary { background: #f3efe8; border: 1px solid #d9d0c0; padding: 8px 24px; border-radius: 60px; font-weight: 500; cursor: pointer; color: #4a5a45; }
        .btn-secondary:hover { background: #e6dfd4; }
        .btn-primary { background: #6e8c6a; border: none; color: white; padding: 8px 28px; border-radius: 60px; font-weight: 500; cursor: pointer; }
        .btn-primary:hover { background: #5c7858; }
        .calendar-modal .modal-content { max-width: 560px; }
        .calendar-modal .modal-content .calendar-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0;
        }
        .calendar-modal .modal-content .calendar-grid .col {
            background: #f8f6f0; border-radius: 16px; padding: 14px 16px;
        }
        .calendar-modal .modal-content .calendar-grid .col h4 {
            font-size: 0.8rem; color: #6f6a5c; margin-bottom: 6px;
            border-bottom: 1px solid #e2dcd0; padding-bottom: 4px;
        }
        .calendar-modal .modal-content .calendar-grid .col .tag-list-wrap {
            display: flex; flex-wrap: wrap; gap: 4px;
        }
        .calendar-modal .modal-content .calendar-grid .col .tag-list-wrap .tag-item-sm {
            background: #fefaf5; padding: 2px 10px; border-radius: 20px;
            font-size: 0.75rem; border: 1px solid #e2dcd0;
        }
        .calendar-modal .modal-content .calendar-grid .col .tag-list-wrap .tag-item-sm.suit {
            border-color: #6e8c6a; color: #3b5a37;
        }
        .calendar-modal .modal-content .calendar-grid .col .tag-list-wrap .tag-item-sm.avoid {
            border-color: #c47b5e; color: #8a4a3a;
        }
        .calendar-modal .modal-content .calendar-info {
            display: flex; flex-wrap: wrap; gap: 8px 20px;
            background: #f8f6f0; border-radius: 16px; padding: 12px 16px;
            margin-top: 8px; font-size: 0.85rem;
        }
        .calendar-modal .modal-content .calendar-info span { color: #4a5a45; }
        .calendar-modal .modal-content .calendar-info strong { color: #2c3e2f; }
        .calendar-modal .modal-content .calendar-header {
            display: flex; justify-content: space-between; flex-wrap: wrap;
            background: #f8f6f0; border-radius: 16px; padding: 12px 16px; margin-bottom: 12px;
        }
        .calendar-modal .modal-content .calendar-header span { color: #4a5a45; }
        .key-status { display: inline-flex; align-items: center; gap: 6px; font-size: 0.75rem; padding: 2px 12px; border-radius: 40px; background: #f3efe8; color: #4a5a45; margin-top: 4px; }
        .key-status .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; }
        .key-status .dot.default { background: #6e8c6a; }
        .key-status .dot.custom { background: #c47b5e; }
        .paste-hint { font-size: 0.7rem; color: #b2aa98; margin-top: 4px; }
        .paste-hint i { color: #6e8c6a; }
        .dropdown-sort-item { display: none; }
        .sort-btn-outside { display: flex; }
        @media (max-width: 680px) {
            body { padding: 16px; }
            .top-header { flex-direction: column; align-items: stretch; }
            .header-right { justify-content: center; }
            .date-calc-popup { right: 10px; left: 10px; justify-content: center; }
            .toolbar { flex-direction: column; align-items: stretch; border-radius: 32px; }
            .search-bar { flex-wrap: wrap; background: #f3efe8; border: 1px solid #e2dcd0; border-radius: 60px; padding: 4px 10px; }
            .search-bar select, .search-bar input, .search-bar button { background: transparent; border: none; padding: 6px 4px; }
            .search-bar button { background: #6e8c6a; color: white; padding: 6px 16px; border-radius: 60px; }
            .toolbar-right { justify-content: center; width: 100%; }
            .sort-btn-outside { display: none !important; }
            .dropdown-sort-item { display: block !important; }
            .operations-dropdown-content .divider.dropdown-sort-item { display: block !important; }
            .sites-grid {
                grid-template-columns: 1fr;
            }
            .card {
                padding: 10px 12px;
                gap: 8px;
                overflow: visible;
            }
            .site-tag-select {
                max-width: 80px;
                flex-shrink: 0;
            }
            .site-name-link {
                font-size: 14px !important;
            }
            .backup-section {
                flex-wrap: wrap;
            }
            .backup-inner {
                flex-wrap: wrap;
                width: 100%;
            }
            .cloud-backup, .local-backup {
                flex-wrap: wrap;
                flex: 1 1 auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-header">
            <div class="header-left">
                <div class="logo-area">
                    <div class="logo">
                        <span class="editable" id="editableTitle">投标</span><span class="fixed-part">·导航</span>
                    </div>
                    <button class="custom-btn" id="openCustomModalBtn" title="自定义设置"><i class="fas fa-cog"></i></button>
                </div>
                <div class="header-right">
                    <button class="huangli-btn" id="huangliBtn" title="查看今日黄历"><i class="fas fa-calendar-alt"></i> 黄历</button>
                    <button class="calc-date-btn" id="calcDateToggleBtn"><i class="fas fa-calculator"></i> 计算日期</button>
                    <div class="email-select-wrapper">
                        <select id="emailSelect">
                            <option value="">📧 邮箱</option>
                            <option value="https://mail.qq.com/">QQ邮箱</option>
                            <option value="https://mail.163.com/">163邮箱</option>
                            <option value="https://www.126.com/">126邮箱</option>
                            <option value="https://exmail.qq.com/login">腾讯企邮</option>
                            <option value="https://mail.sina.com.cn/">新浪邮箱</option>
                            <option value="https://outlook.live.com/">Hotmail</option>
                            <option value="https://www.188.com/">188邮箱</option>
                            <option value="https://mail.google.com/">Gmail</option>
                            <option value="https://qzone.qq.com/">QQ空间</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="date-calc-popup" id="dateCalcPopup">
                <div class="calc-item">
                    <label>📅 开始</label>
                    <input type="date" id="startDate">
                </div>
                <span class="calc-divider">→</span>
                <div class="calc-item">
                    <label>📅 结束</label>
                    <input type="date" id="endDate">
                </div>
                <span class="calc-divider">=</span>
                <div class="calc-item">
                    <label>📆 相差</label>
                    <input type="number" id="diffDays" placeholder="天数" min="0">
                    <span style="font-size:0.7rem; color:#6f6a5c;">天</span>
                </div>
