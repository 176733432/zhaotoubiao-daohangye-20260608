    <div id="toastMsg" class="toast-msg"></div>

    <script>
        (function() {
            // ---------- 数据 ----------
            let sites = [];
            let tags = [];
            let editId = null;
            let sortableInstance = null;
            let currentSearchKeyword = "";
            let currentTagId = "all";
            let editMode = false;
            let deleteMode = false;
            let selectedIds = new Set();
            let currentSort = 'frequency';
            let clickCounts = {};

            const STORAGE_KEY = 'tender_nav_pro_sites';
            const TAGS_KEY = 'tender_nav_tags';
            const CLICK_COUNT_KEY = 'tender_nav_click_counts';
            const TITLE_KEY = 'tender_nav_title';
            const CUSTOM_STYLE_KEY = 'tender_nav_custom_style';
            const API_KEY_KEY = 'tender_nav_api_key';

            const DEFAULT_API_KEY = 'txxvS89xaHq8BZ3RwAjxKcFB0S';
            const defaultCustom = {
                bgColor: '#ecece4',
                textColor: '#2c3e2f',
                fontSize: 15,
                title: '投标'
            };

            let calendarData = null;
            let searchDebounceTimer = null;

            // ----- 获取当前字体大小（纯读取，无副作用） -----
            function getCustomFontSize() {
                try {
                    const stored = localStorage.getItem(CUSTOM_STYLE_KEY);
                    if (stored) {
                        const custom = JSON.parse(stored);
                        if (custom && typeof custom.fontSize === 'number' && custom.fontSize >= 10 && custom.fontSize <=
                            30) {
                            return custom.fontSize;
                        }
                    }
                } catch (e) {}
                return defaultCustom.fontSize;
            }

            // ----- 智能粘贴解析函数 -----
            function parseTitleUrl(text) {
                const urlMatch = text.match(/(https?:\/\/[^\s]+)/);
                if (!urlMatch) {
                    return { title: text.trim(), url: '' };
                }
                const url = urlMatch[0];
                let titlePart = text.substring(0, urlMatch.index).trim();
                if (!titlePart) {
                    titlePart = text.substring(urlMatch.index + url.length).trim();
                }
                titlePart = titlePart.replace(/[\|\-—–]\s*$/, '').trim();
                if (!titlePart) {
                    try {
                        const domain = new URL(url).hostname.replace(/^www\./, '');
                        titlePart = domain;
                    } catch (e) {
                        titlePart = url;
                    }
                }
                return { title: titlePart, url: url };
            }

            // ----- 获取当前使用的密钥 -----
            function getApiKey() {
                const userKey = localStorage.getItem(API_KEY_KEY);
                if (userKey && userKey.trim()) {
                    const trimmed = userKey.trim();
                    if (trimmed.length > 10 && /^[A-Za-z0-9]+$/.test(trimmed)) {
                        return trimmed;
                    } else {
                        localStorage.removeItem(API_KEY_KEY);
                        console.warn('无效的用户密钥已清除');
                    }
                }
                return DEFAULT_API_KEY;
            }

            function isUsingCustomKey() {
                const userKey = localStorage.getItem(API_KEY_KEY);
                return !!(userKey && userKey.trim() && /^[A-Za-z0-9]+$/.test(userKey.trim()) && userKey.trim().length > 10);
            }

            function getMaskedKey(key) {
                if (!key) return '未设置';
                if (key.length <= 8) return key;
                return key.substring(0, 4) + '****' + key.substring(key.length - 4);
            }

            // ---------- 自定义样式管理 ----------
            function loadCustomStyle() {
                const stored = localStorage.getItem(CUSTOM_STYLE_KEY);
                if (stored) {
                    try {
                        const custom = JSON.parse(stored);
                        for (let key in defaultCustom) {
                            if (!(key in custom)) custom[key] = defaultCustom[key];
                        }
                        applyCustomStyle(custom);
                        return custom;
                    } catch (e) { return { ...defaultCustom }; }
                } else {
                    applyCustomStyle(defaultCustom);
                    return { ...defaultCustom };
                }
            }

            function applyCustomStyle(custom) {
                document.body.style.backgroundColor = custom.bgColor || defaultCustom.bgColor;
                document.body.style.color = custom.textColor || defaultCustom.textColor;
                const siteLinks = document.querySelectorAll('.site-name-link');
                const fontSize = (custom.fontSize || defaultCustom.fontSize) + 'px';
                siteLinks.forEach(el => {
                    el.style.fontSize = fontSize;
                });
                const titleEl = document.getElementById('editableTitle');
                if (titleEl && custom.title) {
                    titleEl.textContent = custom.title;
                }
                localStorage.setItem(TITLE_KEY, custom.title || '投标');
            }

            function saveCustomStyle(custom) {
                localStorage.setItem(CUSTOM_STYLE_KEY, JSON.stringify(custom));
                applyCustomStyle(custom);
                localStorage.setItem(TITLE_KEY, custom.title || '投标');
            }

            function resetCustomStyle() {
                saveCustomStyle({ ...defaultCustom });
                applyCustomStyle({ ...defaultCustom });
                document.getElementById('customTitle').value = defaultCustom.title;
                document.getElementById('customBgColor').value = defaultCustom.bgColor;
                document.getElementById('customBgColorText').value = defaultCustom.bgColor;
                document.getElementById('customTextColor').value = defaultCustom.textColor;
                document.getElementById('customTextColorText').value = defaultCustom.textColor;
                document.getElementById('customFontSize').value = defaultCustom.fontSize;
                showToast('已恢复默认样式', 1500);
            }

            function openCustomModal() {
                const current = loadCustomStyle();
                document.getElementById('customTitle').value = current.title || '投标';
                document.getElementById('customBgColor').value = current.bgColor || '#ecece4';
                document.getElementById('customBgColorText').value = current.bgColor || '#ecece4';
                document.getElementById('customTextColor').value = current.textColor || '#2c3e2f';
                document.getElementById('customTextColorText').value = current.textColor || '#2c3e2f';
                document.getElementById('customFontSize').value = current.fontSize || 15;
                updateKeyStatusUI();
                document.getElementById('customModal').style.display = 'flex';
            }

            function closeCustomModal() {
                document.getElementById('customModal').style.display = 'none';
            }

            function updateKeyStatusUI() {
                const statusText = document.getElementById('keyStatusText');
                const dot = document.querySelector('#keyStatus .dot');
                const currentKey = getApiKey();
                const isCustom = isUsingCustomKey();
                if (isCustom) {
                    statusText.textContent = `当前使用：自定义密钥 (${getMaskedKey(currentKey)})`;
                    dot.className = 'dot custom';
                } else {
                    statusText.textContent = `当前使用：默认密钥 (${getMaskedKey(currentKey)})`;
                    dot.className = 'dot default';
                }
            }

            function resetApiKey() {
                localStorage.removeItem(API_KEY_KEY);
                updateKeyStatusUI();
                fetchLunarData();
                showToast('已重置为默认密钥', 1500);
            }

            // ---------- 标题自定义 ----------
            function loadTitle() {
                const saved = localStorage.getItem(TITLE_KEY);
                if (saved) document.getElementById('editableTitle').textContent = saved;
            }

            function saveTitle(newTitle) {
                localStorage.setItem(TITLE_KEY, newTitle);
                document.getElementById('editableTitle').textContent = newTitle;
            }

            // ---------- 日期计算 ----------
            function clearDateFields() {
                document.getElementById('startDate').value = '';
                document.getElementById('endDate').value = '';
                document.getElementById('diffDays').value = '';
            }

            function calcDate() {
                const start = document.getElementById('startDate');
                const end = document.getElementById('endDate');
                const diff = document.getElementById('diffDays');
                const startVal = start.value;
                const endVal = end.value;
                const diffVal = diff.value;
                let filled = 0;
                if (startVal) filled++;
                if (endVal) filled++;
                if (diffVal) filled++;
                if (filled < 2) { showToast('请至少输入两项才能计算', 1500); return; }
                if (filled === 3) {
                    if (startVal && endVal) {
                        const d1 = new Date(startVal);
                        const d2 = new Date(endVal);
                        if (!isNaN(d1) && !isNaN(d2)) {
                            const days = Math.round(Math.abs(d2 - d1) / (1000 * 60 * 60 * 24));
                            diff.value = days;
                            showToast(`计算完成：相差 ${days} 天`, 1200);
                            return;
                        } else { showToast('日期格式无效', 1500); return; }
                    }
                }
                if (startVal && endVal) {
                    const d1 = new Date(startVal);
                    const d2 = new Date(endVal);
                    if (!isNaN(d1) && !isNaN(d2)) {
                        const days = Math.round(Math.abs(d2 - d1) / (1000 * 60 * 60 * 24));
                        diff.value = days;
                        showToast(`计算完成：相差 ${days} 天`, 1200);
                    } else { showToast('日期格式无效', 1500); }
                } else if (startVal && diffVal) {
                    const d1 = new Date(startVal);
                    const days = parseInt(diffVal);
                    if (!isNaN(d1) && !isNaN(days) && days >= 0) {
                        const d2 = new Date(d1);
                        d2.setDate(d2.getDate() + days);
                        end.value = d2.toISOString().split('T')[0];
                        showToast(`计算完成：结束日期为 ${end.value}`, 1200);
                    } else { showToast('请输入有效的天数（≥0）', 1500); }
                } else if (endVal && diffVal) {
                    const d2 = new Date(endVal);
                    const days = parseInt(diffVal);
                    if (!isNaN(d2) && !isNaN(days) && days >= 0) {
                        const d1 = new Date(d2);
                        d1.setDate(d1.getDate() - days);
                        start.value = d1.toISOString().split('T')[0];
                        showToast(`计算完成：开始日期为 ${start.value}`, 1200);
                    } else { showToast('请输入有效的天数（≥0）', 1500); }
                } else { showToast('请至少输入两项（开始/结束/天数）', 1500); }
            }

            // ---------- 农历 + 黄历 API ----------
            async function fetchLunarData() {
                const key = getApiKey();
                const dateMain = document.getElementById('dateMain');
                const dateLunar = document.getElementById('dateLunar');
                const now = new Date();
                const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
                const dateStr =
                    `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} 周${weekdays[now.getDay()]}`;
                dateMain.textContent = dateStr;
                if (!key) {
                    dateLunar.textContent = '⚠️ 密钥无效';
                    dateLunar.className = 'date-lunar date-error';
                    showToast('API密钥无效，请在自定义设置中配置', 3000);
                    return;
                }
                dateLunar.className = 'date-lunar date-loading';
                dateLunar.textContent = '获取农历...';
                try {
                    const url =
                        `https://api.t1qq.com/api/tool/day/time?key=${encodeURIComponent(key)}`;
                    const resp = await fetch(url);
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                    const data = await resp.json();
                    if (data.code === 200 && data.data) {
                        const lunarStr = data.data.lunar || '';
                        if (lunarStr) {
                            dateLunar.textContent = lunarStr;
                            dateLunar.className = 'date-lunar';
                            calendarData = data.data;
                        } else {
                            dateLunar.textContent = '农历获取失败';
                            dateLunar.className = 'date-lunar date-error';
                        }
                    } else {
                        const errMsg = data.msg || 'API返回错误';
                        dateLunar.textContent = '农历加载失败';
                        dateLunar.className = 'date-lunar date-error';
                        console.warn('API错误:', errMsg);
                        if (data.code === 401 || data.code === 403 || errMsg.includes('key') || errMsg.includes(
                                '密钥')) {
                            showToast('API密钥无效，请在自定义设置中配置正确的密钥', 4000);
                        } else {
                            showToast(`获取农历失败：${errMsg}`, 3000);
                        }
                    }
                } catch (err) {
                    console.warn('获取农历失败:', err);
                    dateLunar.textContent = '网络错误，请重试';
                    dateLunar.className = 'date-lunar date-error';
                    showToast('无法连接到黄历API，请检查网络', 3000);
                }
            }

            function showCalendar() {
                const modal = document.getElementById('calendarModal');
                const content = document.getElementById('calendarContent');
                modal.style.display = 'flex';
                content.innerHTML =
                    '<div style="text-align:center; color:#b2aa98; padding:20px;">加载黄历中...</div>';
                const key = getApiKey();
                if (!key) {
                    content.innerHTML = `
                <div style="text-align:center; color:#c47b5e; padding:20px;">
                  <i class="fas fa-exclamation-circle"></i> API密钥无效，请先在自定义设置中配置
                </div>`;
                    return;
                }
                if (calendarData) { renderCalendarContent(calendarData); return; }
                fetch(`https://api.t1qq.com/api/tool/day/time?key=${encodeURIComponent(key)}`)
                    .then(resp => resp.json())
                    .then(data => {
                        if (data.code === 200 && data.data) {
                            calendarData = data.data;
                            renderCalendarContent(data.data);
                        } else {
                            const errMsg = data.msg || '未知错误';
                            content.innerHTML = `
                        <div style="text-align:center; color:#c47b5e; padding:20px;">
                          <i class="fas fa-exclamation-circle"></i> 获取黄历失败：${errMsg}
                        </div>`;
                        }
                    })
                    .catch(err => {
                        content.innerHTML = `
                  <div style="text-align:center; color:#c47b5e; padding:20px;">
                    <i class="fas fa-exclamation-circle"></i> 网络错误，请稍后重试
                  </div>`;
                        console.warn('获取黄历失败:', err);
                    });
            }

            function renderCalendarContent(data) {
                const content = document.getElementById('calendarContent');
                const lunarDate = data.lunar || '--';
                const solarDate = data.solar || '--';
                const zodiac = data.zodiac || '--';
                const week = data.Week || '--';
                const yi = data.luckyDay?.yi || [];
                const ji = data.luckyDay?.ji || [];
                const chong = data.dayxiangchong?.chongDesc || '--';
                const jiShen = data.jsxs?.jiShen || [];
                const xiongSha = data.jsxs?.xiongSha || [];
                const xingXiu = data.xingXiu?.xiu || '--';
                const xingXiuLucky = data.xingXiu?.lucky || '--';
                const tianShen = data.tianShen?.day || '--';
                const tianShenLucky = data.tianShen?.lucky || '--';
                content.innerHTML = `
            <div class="calendar-header">
              <span><strong>📅 公历</strong> ${solarDate}</span>
              <span><strong>🌙 农历</strong> ${lunarDate}</span>
              <span><strong>🐾 生肖</strong> ${zodiac}</span>
              <span><strong>📆 星期</strong> ${week}</span>
            </div>
            <div class="calendar-grid">
              <div class="col">
                <h4>✅ 宜</h4>
                <div class="tag-list-wrap">
                  ${yi.length > 0 ? yi.map(s => `<span class="tag-item-sm suit">${s}</span>`).join('') : '<span style="color:#b2aa98;">无</span>'}
                </div>
              </div>
              <div class="col">
                <h4>❌ 忌</h4>
                <div class="tag-list-wrap">
                  ${ji.length > 0 ? ji.map(s => `<span class="tag-item-sm avoid">${s}</span>`).join('') : '<span style="color:#b2aa98;">无</span>'}
                </div>
              </div>
            </div>
            <div class="calendar-info">
              <span><strong>冲煞：</strong> ${chong}</span>
              ${jiShen.length > 0 ? `<span><strong>吉神：</strong> ${jiShen.join('、')}</span>` : ''}
              ${xiongSha.length > 0 ? `<span><strong>凶煞：</strong> ${xiongSha.join('、')}</span>` : ''}
              ${xingXiu !== '--' ? `<span><strong>星宿：</strong> ${xingXiu} (${xingXiuLucky})</span>` : ''}
              ${tianShen !== '--' ? `<span><strong>天仙：</strong> ${tianShen} (${tianShenLucky})</span>` : ''}
            </div>`;
            }

            function closeCalendar() {
                document.getElementById('calendarModal').style.display = 'none';
            }

            // ---------- 辅助函数 ----------
            function showToast(msg, duration = 2200) {
                const toast = document.getElementById('toastMsg');
                toast.textContent = msg;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), duration);
            }

            function saveToLocal() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(sites));
                localStorage.setItem(TAGS_KEY, JSON.stringify(tags));
            }

            function loadClickCounts() {
                const stored = localStorage.getItem(CLICK_COUNT_KEY);
                try { clickCounts = stored ? JSON.parse(stored) : {}; } catch (e) { clickCounts = {}; }
            }

            function saveClickCounts() { localStorage.setItem(CLICK_COUNT_KEY, JSON.stringify(clickCounts)); }

            function incrementClickCount(url) {
                clickCounts[url] = (clickCounts[url] || 0) + 1;
                saveClickCounts();
                if (currentSort === 'frequency' && !currentSearchKeyword) applySortAndRender();
            }

            function initTags() {
                const stored = localStorage.getItem(TAGS_KEY);
                if (stored) {
                    try { tags = JSON.parse(stored); if (!Array.isArray(tags)) tags = []; } catch (e) { tags = []; }
                }
                if (!tags.length) tags = [{ id: "tag_default", name: "默认" }];
            }

            function getDefaultTagId() { return tags[0]?.id || "tag_default"; }

            async function loadFromDefaultCloudKey() {
                try {
                    const data = await readTextDB('zdscj20020308');
                    if (data) {
                        const parsed = JSON.parse(data);
                        if (parsed.sites && Array.isArray(parsed.sites) && parsed.tags && Array.isArray(parsed.tags)) {
                            sites = parsed.sites;
                            tags = parsed.tags;
                            if (parsed.clickCounts) clickCounts = parsed.clickCounts;
                            return true;
                        }
                    }
                    return false;
                } catch (e) {
                    console.warn('加载默认云端数据失败:', e);
                    return false;
                }
            }

            async function initData() {
                initTags();
                loadTitle();
                loadCustomStyle();
                const storedSites = localStorage.getItem(STORAGE_KEY);
                if (storedSites) {
                    try { sites = JSON.parse(storedSites); if (!Array.isArray(sites)) sites = []; } catch (e) { sites = []; }
                    loadClickCounts();
                } else {
                    sites = [];
                    const success = await loadFromDefaultCloudKey();
                    if (!success) tags = [{ id: "tag_default", name: "默认" }];
                    saveToLocal();
                    saveClickCounts();
                }
                const defaultTag = tags[0]?.id || "tag_default";
                sites.forEach(s => { if (!s.tagId) s.tagId = defaultTag; });
                if (!tags.length) { tags = [{ id: "tag_default", name: "默认" }];
                    saveToLocal(); }
                updateKeyStatusUI();
                await fetchLunarData();
            }

            function sortSitesBy(type) {
                if (type === 'name') sites.sort((a, b) => a.name.localeCompare(b.name, 'zh'));
                else if (type === 'frequency') sites.sort((a, b) => (clickCounts[b.url] || 0) - (clickCounts[a.url] || 0));
                saveToLocal();
            }

            function applySortAndRender() {
                if (currentSearchKeyword) {
                    currentSearchKeyword = '';
                    document.getElementById('globalSearchInput').value = '';
                    renderSites();
                } else {
                    sortSitesBy(currentSort);
                    renderSites();
                }
            }

            // 标签栏渲染
            function renderTagBar() {
                const container = document.getElementById('tagListContainer');
                let html =
                    `<div class="tag-item ${currentTagId === 'all' ? 'active' : ''}" data-tag="all"><span class="tag-name">全部</span></div>`;
                tags.forEach(tag => {
                    html +=
                        `<div class="tag-item ${currentTagId === tag.id ? 'active' : ''}" data-tag="${tag.id}">
                  <span class="tag-name">${escapeHtml(tag.name)}</span>
                  <button class="edit-tag" data-tagid="${tag.id}" title="编辑标签"><i class="fas fa-edit"></i></button>
                  <button class="del-tag" data-tagid="${tag.id}" title="删除标签"><i class="fas fa-trash-alt"></i></button>
                </div>`;
                });
                container.innerHTML = html;
                document.querySelectorAll('.tag-item').forEach(el => {
                    const tagId = el.dataset.tag;
                    el.addEventListener('click', (e) => {
                        if (e.target.closest('.edit-tag') || e.target.closest('.del-tag')) return;
                        currentTagId = tagId;
                        renderTagBar();
                        renderSites();
                    });
                });
                document.querySelectorAll('.edit-tag').forEach(btn => btn.addEventListener('click', (e) => { e
                        .stopPropagation();
                    editTagById(btn.dataset.tagid); }));
                document.querySelectorAll('.del-tag').forEach(btn => btn.addEventListener('click', (e) => { e
                        .stopPropagation();
                    deleteTagById(btn.dataset.tagid); }));
            }

            function editTagById(tagId) {
                const tag = tags.find(t => t.id === tagId);
                if (!tag) return;
                const newName = prompt("编辑标签名称", tag.name);
                if (newName && newName.trim()) {
                    if (tags.some(t => t.id !== tagId && t.name === newName.trim())) { showToast("标签名称已存在",
                        "error"); return; }
                    tag.name = newName.trim();
                    saveToLocal();
                    renderTagBar();
                    renderSites();
                }
            }

            function deleteTagById(tagId) {
                if (tags.length <= 1) { showToast("至少保留一个标签", "warning"); return; }
                const tag = tags.find(t => t.id === tagId);
                if (!tag) return;
                if (confirm(`删除标签"${tag.name}"，其下网站将移至"默认"标签，确定吗？`)) {
                    const defaultTag = tags.find(t => t.name === "默认") || tags[0];
                    sites.forEach(s => { if (s.tagId === tagId) s.tagId = defaultTag.id; });
                    tags = tags.filter(t => t.id !== tagId);
                    if (currentTagId === tagId) currentTagId = "all";
                    saveToLocal();
                    renderTagBar();
                    renderSites();
                    showToast(`已删除标签"${tag.name}"`);
                }
            }

            function addNewTag() {
                let newName = prompt("请输入新标签名称");
                if (!newName || !newName.trim()) return;
                newName = newName.trim();
                if (tags.some(t => t.name === newName)) { showToast("标签已存在", "error"); return; }
                const newId = "tag_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
                tags.push({ id: newId, name: newName });
                saveToLocal();
                renderTagBar();
                currentTagId = newId;
                renderTagBar();
                renderSites();
                showToast(`标签"${newName}"已创建`);
            }

            function showManageTags() {
                const container = document.getElementById('tagsManageList');
                let html =
                    `<div style="margin-bottom:16px;"><button id="quickAddTagBtn" class="btn-secondary" style="width:100%;">➕ 新建标签</button></div>`;
                tags.forEach(tag => {
                    html +=
                        `<div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #e2dcd0;">
                  <span>${escapeHtml(tag.name)}</span>
                  <div>
                    <button class="btn-secondary manage-edit-tag" data-id="${tag.id}" style="margin-right:8px;">编辑</button>
                    <button class="btn-secondary manage-del-tag" data-id="${tag.id}" ${tags.length <= 1 ? 'disabled' : ''}>删除</button>
                  </div>
                </div>`;
                });
                container.innerHTML = html;
                document.getElementById('quickAddTagBtn')?.addEventListener('click', () => { addNewTag();
                    showManageTags(); });
                document.querySelectorAll('.manage-edit-tag').forEach(btn => btn.addEventListener('click', () => {
                    editTagById(btn.dataset.id);
                    showManageTags(); }));
                document.querySelectorAll('.manage-del-tag').forEach(btn => btn.addEventListener('click', () => {
                    deleteTagById(btn.dataset.id);
                    showManageTags(); }));
                document.getElementById('manageTagsModal').style.display = 'flex';
            }

            // ----- 网站操作 -----
            function openAddModal() {
                const select = document.getElementById('modalTagSelect');
                select.innerHTML = tags.map(t =>
                    `<option value="${t.id}" ${currentTagId !== 'all' && currentTagId !== t.id ? '' : 'selected'}>${escapeHtml(t.name)}</option>`
                    ).join('');
                document.getElementById('addSiteModal').style.display = 'flex';
                document.getElementById('modalAddUrl').value = '';
                document.getElementById('modalAddName').value = '';
            }

            async function addSiteFromModal() {
                let url = document.getElementById('modalAddUrl').value.trim();
                let name = document.getElementById('modalAddName').value.trim();
                const tagId = document.getElementById('modalTagSelect').value;
                if (!url) { showToast('请填写网址', 1200); return; }
                if (!url.startsWith('http')) url = 'https://' + url;
                if (!name) {
                    try { name = new URL(url).hostname.replace(/^www\./, ''); } catch (e) { name = '未命名'; }
                }
                if (sites.some(s => s.url === url)) { showToast('网址已存在', 1500); return; }
                const newId = Date.now() + Math.floor(Math.random() * 100000);
                sites.push({ id: newId, name: name.substring(0, 100), url, tagId });
                saveToLocal();
                applySortAndRender();
                closeAddModal();
                showToast(`✨ 已添加 ${name}`);
            }

            function closeAddModal() {
                document.getElementById('addSiteModal').style.display = 'none';
                document.getElementById('modalAddUrl').value = '';
                document.getElementById('modalAddName').value = '';
            }

            function openEditModalById(id) {
                const site = sites.find(s => s.id === id);
                if (!site) return;
                editId = id;
                document.getElementById('editName').value = site.name;
                document.getElementById('editUrl').value = site.url;
                const select = document.getElementById('editTagSelect');
                select.innerHTML = tags.map(t =>
                    `<option value="${t.id}" ${t.id === site.tagId ? 'selected' : ''}>${escapeHtml(t.name)}</option>`).join(
                    '');
                document.getElementById('editModal').style.display = 'flex';
            }

            function saveEdit() {
                if (editId === null) return;
                const newName = document.getElementById('editName').value.trim();
                let newUrl = document.getElementById('editUrl').value.trim();
                const newTagId = document.getElementById('editTagSelect').value;
                if (!newName || !newUrl) { showToast('名称和网址不能为空', 1200); return; }
                if (!newUrl.startsWith('http')) newUrl = 'https://' + newUrl;
                const idx = sites.findIndex(s => s.id === editId);
                if (idx !== -1) {
                    if (sites.some(s => s.id !== editId && s.url === newUrl)) { showToast('网址已存在', 1500); return; }
                    sites[idx].name = newName;
                    sites[idx].url = newUrl;
                    sites[idx].tagId = newTagId;
                    saveToLocal();
                    applySortAndRender();
                    showToast('修改成功');
                }
                closeEditModal();
            }

            function closeEditModal() { document.getElementById('editModal').style.display = 'none';
                editId = null; }

            function enterDeleteMode() {
                if (editMode) exitEditMode();
                deleteMode = true;
                selectedIds.clear();
                const delBtn = document.getElementById('deleteModeBtn');
                delBtn.textContent = '取消删除';
                delBtn.classList.add('active');
                if (sortableInstance) sortableInstance.destroy();
                sortableInstance = null;
                renderSites();
            }

            function exitDeleteMode(resetSelection = true) {
                deleteMode = false;
                if (resetSelection) selectedIds.clear();
                const delBtn = document.getElementById('deleteModeBtn');
                delBtn.textContent = '删除';
                delBtn.classList.remove('active');
                reinitSortable();
                renderSites();
            }

            function updateDeleteButtonText() {
                if (!deleteMode) return;
                const delBtn = document.getElementById('deleteModeBtn');
                delBtn.textContent = selectedIds.size > 0 ? '确认删除' : '取消删除';
            }

            function confirmDeleteSelected() {
                if (selectedIds.size === 0) { exitDeleteMode(true); return; }
                const toDelete = sites.filter(s => selectedIds.has(s.id));
                const names = toDelete.map(s => s.name).join('、');
                if (confirm(`确认删除以下 ${toDelete.length} 个网站吗？\n${names}`)) {
                    sites = sites.filter(s => !selectedIds.has(s.id));
                    saveToLocal();
                    exitDeleteMode(true);
                    applySortAndRender();
                    showToast(`已删除 ${toDelete.length} 个网站`);
                } else updateDeleteButtonText();
            }

            function toggleDeleteSelection(id) {
                if (selectedIds.has(id)) selectedIds.delete(id);
                else selectedIds.add(id);
                updateDeleteButtonText();
                const card = document.querySelector(`.card[data-id='${id}']`);
                if (card) card.classList.toggle('selected', selectedIds.has(id));
            }

            function enterEditMode() {
                if (deleteMode) exitDeleteMode(true);
                editMode = true;
                const editBtn = document.getElementById('editModeBtn');
                editBtn.textContent = '取消编辑';
                editBtn.classList.add('active');
                if (sortableInstance) sortableInstance.destroy();
                sortableInstance = null;
                renderSites();
            }

            function exitEditMode() {
                editMode = false;
                const editBtn = document.getElementById('editModeBtn');
                editBtn.textContent = '编辑';
                editBtn.classList.remove('active');
                reinitSortable();
                renderSites();
            }

            function reinitSortable() {
                if (sortableInstance) sortableInstance.destroy();
                const container = document.getElementById('sitesGridContainer');
                if (container && !editMode && !deleteMode && currentTagId === 'all' && !currentSearchKeyword) {
                    sortableInstance = new Sortable(container, {
                        handle: '.drag-handle',
                        animation: 200,
                        onEnd: () => {
                            const cards = document.querySelectorAll('.card');
                            const newOrder = [];
                            cards.forEach(card => {
                                const id = Number(card.dataset.id);
                                const found = sites.find(s => s.id === id);
                                if (found) newOrder.push(found);
                            });
                            if (newOrder.length === sites.length) { sites = newOrder;
                                saveToLocal(); if (currentSearchKeyword) renderSites(); } else renderSites();
                        }
                    });
                } else sortableInstance = null;
            }

            // 核心渲染函数（已修复字体回退问题）
            function renderSites() {
                const container = document.getElementById('sitesGridContainer');
                if (!container) return;

                // ★ 关键修复：在生成HTML之前获取用户自定义的字体大小
                const customFontSize = getCustomFontSize();

                let filtered = currentTagId === 'all' ? sites : sites.filter(s => s.tagId === currentTagId);
                if (currentSearchKeyword) {
                    const keyword = currentSearchKeyword.toLowerCase().trim();
                    if (keyword) {
                        const matched = [];
                        const unmatched = [];
                        filtered.forEach(site => {
                            if (site.name.toLowerCase().includes(keyword)) matched.push(site);
                            else unmatched.push(site);
                        });
                        filtered = matched.concat(unmatched);
                    }
                }

                if (filtered.length === 0) {
                    container.innerHTML =
                        `<div class="empty-state"><i class="fas fa-folder-open"></i><p>暂无网站，点击「添加网站」或导入收藏夹</p></div>`;
                    if (!editMode && !deleteMode && currentTagId === 'all' && !currentSearchKeyword) reinitSortable();
                    else if (sortableInstance) sortableInstance.destroy();
                    return;
                }
                let html = '';
                filtered.forEach(site => {
                    const selectedClass = (deleteMode && selectedIds.has(site.id)) ? 'selected' : '';
                    const highlightClass = (currentSearchKeyword && site.name.toLowerCase().includes(
                        currentSearchKeyword.toLowerCase().trim())) ? 'highlight' : '';
                    // ★ 在链接中直接内联字体大小，确保搜索重新渲染后字体不会回退
                    html +=
                        `<div class="card ${selectedClass} ${highlightClass}" data-id="${site.id}">
                  <i class="fas fa-grip-vertical drag-handle"></i>
                  <a href="${escapeHtml(site.url)}" target="_blank" rel="noopener noreferrer" class="site-name-link"
                     data-id="${site.id}" data-url="${escapeHtml(site.url)}"
                     title="访问 ${escapeHtml(site.name)}"
                     style="font-size:${customFontSize}px;">${escapeHtml(site.name)}</a>
                  <select class="site-tag-select" data-id="${site.id}">
                    ${tags.map(t => `<option value="${t.id}" ${t.id === site.tagId ? 'selected' : ''}>${escapeHtml(t.name)}</option>`).join('')}
                  </select>
                </div>`;
                });
                container.innerHTML = html;
                document.querySelectorAll('.card').forEach(card => {
                    const id = Number(card.dataset.id);
                    const link = card.querySelector('.site-name-link');
                    if (link && (editMode || deleteMode)) {
                        const newLink = link.cloneNode(true);
                        link.parentNode.replaceChild(newLink, link);
                        newLink.addEventListener('click', (e) => { e.preventDefault(); if (editMode)
                                openEditModalById(id); else if (deleteMode) toggleDeleteSelection(
                                id); });
                    } else if (link && !editMode && !deleteMode) {
                        link.addEventListener('click', (e) => { incrementClickCount(link.getAttribute(
                                'data-url')); });
                    }
                    card.addEventListener('click', (e) => {
                        if (e.target.closest('.site-name-link') || e.target.closest('.site-tag-select'))
                            return;
                        if (editMode) openEditModalById(id);
                        else if (deleteMode) toggleDeleteSelection(id);
                    });
                    const tagSelect = card.querySelector('.site-tag-select');
                    tagSelect?.addEventListener('change', (e) => {
                        e.stopPropagation();
                        const site = sites.find(s => s.id === id);
                        if (site && site.tagId !== tagSelect.value) { site.tagId = tagSelect.value;
                            saveToLocal();
                            renderSites();
                            showToast(
                                `已移动至 ${tags.find(t => t.id === tagSelect.value)?.name}`); }
                    });
                });
                if (currentSearchKeyword) {
                    const firstHighlight = container.querySelector('.card.highlight');
                    if (firstHighlight) {
                        firstHighlight.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }
                if (!editMode && !deleteMode && currentTagId === 'all' && !currentSearchKeyword) reinitSortable();
                else if (sortableInstance) sortableInstance.destroy();

                // 同步body等其他样式（此时链接已有内联font-size，不会被覆盖）
                loadCustomStyle();
            }

            function clearSearch() {
                document.getElementById('globalSearchInput').value = '';
                currentSearchKeyword = '';
                if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
                sortSitesBy(currentSort);
                renderSites();
            }

            function handleGlobalSearchInput() {
                const value = document.getElementById('globalSearchInput').value.trim();
                currentSearchKeyword = value;
                if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
                if (!value) { sortSitesBy(currentSort);
                    renderSites(); return; }
                renderSites();
                const hasMatch = sites.some(site => site.name.toLowerCase().includes(value.toLowerCase()));
                if (!hasMatch) {
                    searchDebounceTimer = setTimeout(() => {
                        performWebSearch(value);
                        searchDebounceTimer = null;
                    }, 500);
                }
            }

            function performWebSearch(keyword) {
                const select = document.getElementById('engineSelect');
                const engine = select.value;
                let url = '';
                if (engine === 'baidu') url = `https://www.baidu.com/s?wd=${encodeURIComponent(keyword)}`;
                else if (engine === 'bing') url =
                    `https://cn.bing.com/search?q=${encodeURIComponent(keyword)}`;
                else if (engine === 'google') url =
                    `https://www.google.com/search?q=${encodeURIComponent(keyword)}`;
                if (url) { window.open(url, '_blank');
                    showToast(`未找到站内匹配，已跳转 ${select.options[select.selectedIndex].text} 搜索`, 1500); }
            }

            function clearAllSites() {
                if (sites.length === 0) { showToast('当前没有网站可清空', 1500); return; }
                if (confirm('⚠️ 确定要清空所有网站吗？此操作不可撤销！')) {
                    sites = [];
                    saveToLocal();
                    clearSearch();
                    renderSites();
                    showToast('已清空所有网站', 1500);
                }
            }

            // 导入收藏夹
            async function importBookmarksFromHtml(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const doc = new DOMParser().parseFromString(e.target.result, 'text/html');
                        const links = doc.querySelectorAll('a');
                        if (links.length === 0) reject('未找到链接');
                        const newSites = [],
                            existing = new Set(sites.map(s => s.url));
                        const defaultTag = tags[0]?.id || "tag_default";
                        for (let link of links) {
                            let href = link.getAttribute('href');
                            let title = link.textContent?.trim() || link.getAttribute('title') || '';
                            if (!href || (!href.startsWith('http') && !href.startsWith('https'))) continue;
                            if (!title) try { title = new URL(href).hostname; } catch (e) { title = '导入站点'; }
                            if (!existing.has(href)) {
                                newSites.push({ id: Date.now() + Math.random() * 10000 + newSites.length,
                                    name: title.substring(0, 100), url: href, tagId: defaultTag });
                                existing.add(href);
                            }
                        }
                        resolve(newSites);
                    };
                    reader.onerror = () => reject('文件读取失败');
                    reader.readAsText(file, 'UTF-8');
                });
            }
            async function handleImport(file) {
                if (!file) return;
                try {
                    const imported = await importBookmarksFromHtml(file);
                    if (!imported.length) { showToast('无新链接或格式无效', 2000); return; }
                    sites.push(...imported);
                    saveToLocal();
                    applySortAndRender();
                    showToast(`📥 成功导入 ${imported.length} 个站点`, 2000);
                } catch (e) { showToast('解析失败，请检查文件格式', 2500); }
            }

            // 云端备份 (分片稳定版)
            const MAX_VALUE_SIZE = 200000;
            async function writeTextDB(key, value) {
                const url =
                    `https://textdb.online/update/?key=${encodeURIComponent(key)}&value=${encodeURIComponent(value)}`;
                const resp = await fetch(url, { method: 'POST' });
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const json = await resp.json();
                if (json.status !== 1) throw new Error(`API返回失败`);
                return json;
            }
            async function readTextDB(key) {
                const resp = await fetch(`https://textdb.online/${encodeURIComponent(key)}`, { method: 'GET' });
                if (!resp.ok) return null;
                return await resp.text() || null;
            }
            async function backupToCloud() {
                const masterKey = document.getElementById('cloudKey').value.trim();
                if (!/^[0-9a-zA-Z\-_]{6,60}$/.test(masterKey)) { showToast('主KEY格式无效', 3000); return; }
                const data = { sites, tags, clickCounts };
                const dataStr = JSON.stringify(data);
                const totalLen = dataStr.length;
                const btn = document.getElementById('backupToCloudBtn');
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> 备份中...';
                try {
                    if (totalLen <= MAX_VALUE_SIZE) {
                        await writeTextDB(masterKey, dataStr);
                        showToast('✅ 云端备份成功 (单片)', 2000);
                    } else {
                        const CHUNK_SIZE = 180000;
                        const batchCount = Math.ceil(totalLen / CHUNK_SIZE);
                        await writeTextDB(masterKey, JSON.stringify({ batches: batchCount }));
                        for (let i = 0; i < batchCount; i++) {
                            const start = i * CHUNK_SIZE;
                            const end = Math.min(start + CHUNK_SIZE, totalLen);
                            const chunk = dataStr.substring(start, end);
                            await writeTextDB(`${masterKey}_batch${i}`, chunk);
                        }
                        showToast(`✅ 云端备份成功 (分${batchCount}片)`, 3000);
                    }
                } catch (err) { showToast(`❌ 云端备份失败: ${err.message}`, 4000);
                    backupToLocal(); } finally { btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-upload"></i> 分片备份'; }
            }
            async function restoreFromCloud() {
                const masterKey = document.getElementById('cloudKey').value.trim();
                if (!/^[0-9a-zA-Z\-_]{6,60}$/.test(masterKey)) { showToast('主KEY格式不正确', 3000); return; }
                const btn = document.getElementById('restoreFromCloudBtn');
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> 恢复中...';
                try {
                    const masterData = await readTextDB(masterKey);
                    if (!masterData) { showToast('云端无数据', 3000); return; }
                    let fullData = '';
                    if (masterData.trim().startsWith('{') && masterData.includes('"batches"')) {
                        let meta; try { meta = JSON.parse(masterData); } catch (e) { meta = null; }
                        if (meta && meta.batches) {
                            const chunks = [];
                            for (let i = 0; i < meta.batches; i++) {
                                const chunk = await readTextDB(`${masterKey}_batch${i}`);
                                if (chunk === null) throw new Error(`缺少分片 _batch${i}`);
                                chunks.push(chunk);
                            }
                            fullData = chunks.join('');
                        } else fullData = masterData;
                    } else fullData = masterData;
                    if (!fullData) throw new Error('数据为空');
                    const restored = JSON.parse(fullData);
                    if (restored.sites && Array.isArray(restored.sites) && restored.tags && Array.isArray(restored
                            .tags)) {
                        if (confirm(`从云端恢复将覆盖当前所有网站和标签，确定吗？`)) {
                            sites = restored.sites;
                            tags = restored.tags;
                            if (restored.clickCounts) clickCounts = restored.clickCounts;
                            saveToLocal();
                            saveClickCounts();
                            renderTagBar();
                            applySortAndRender();
                            showToast(`🌐 已从云端恢复 ${sites.length} 个站点`, 2000);
                        }
                    } else throw new Error('数据结构不完整');
                } catch (err) { showToast(`恢复失败: ${err.message}`, 4000); } finally { btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-download"></i> 分片恢复'; }
            }

            function generateRandomKey() {
                const chars = '0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ-_';
                let result = '';
                for (let i = 0; i < 20; i++) result += chars.charAt(Math.floor(Math.random() * chars.length));
                document.getElementById('cloudKey').value = result;
                showToast('已生成随机KEY', 1500);
            }

            function backupToLocal() {
                const data = { sites, tags, clickCounts };
                const dataStr = JSON.stringify(data, null, 2);
                const blob = new Blob([dataStr], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `tender_backup_${new Date().toISOString().slice(0, 19)}.json`;
                a.click();
                URL.revokeObjectURL(a.href);
                showToast('✅ 已备份到本地', 1500);
            }

            function triggerLocalRestore() { document.getElementById('localRestoreFile').click(); }

            function handleLocalRestore(file) {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const restored = JSON.parse(e.target.result);
                        if (restored.sites && Array.isArray(restored.sites) && restored.tags && Array.isArray(
                                restored.tags)) {
                            if (confirm(`从本地恢复将覆盖当前所有网站和标签，确定吗？`)) {
                                sites = restored.sites;
                                tags = restored.tags;
                                if (restored.clickCounts) clickCounts = restored.clickCounts;
                                saveToLocal();
                                saveClickCounts();
                                renderTagBar();
                                applySortAndRender();
                                showToast(`📁 已从本地恢复 ${sites.length} 个站点`, 2000);
                            }
                        } else throw new Error('文件格式错误');
                    } catch (err) { showToast('恢复失败：文件解析错误', 3000); }
                };
                reader.readAsText(file);
            }

            function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;',
                    '>': '&gt;' }[m])); }

            function bindEvents() {
                document.getElementById('openCustomModalBtn').addEventListener('click', openCustomModal);
                document.getElementById('closeCustomBtn').addEventListener('click', closeCustomModal);
                document.getElementById('saveCustomBtn').addEventListener('click', function() {
                    const title = document.getElementById('customTitle').value.trim() || '投标';
                    const bgColor = document.getElementById('customBgColor').value || '#ecece4';
                    const textColor = document.getElementById('customTextColor').value || '#2c3e2f';
                    const fontSize = parseInt(document.getElementById('customFontSize').value) || 15;
                    const apiKey = document.getElementById('customApiKey').value.trim();
                    const custom = { title, bgColor, textColor, fontSize };
                    saveCustomStyle(custom);
                    document.getElementById('editableTitle').textContent = title;
                    if (apiKey) {
                        if (apiKey.length > 10 && /^[A-Za-z0-9]+$/.test(apiKey)) {
                            localStorage.setItem(API_KEY_KEY, apiKey);
                            showToast('自定义密钥已保存', 1500);
                        } else { showToast('密钥格式无效，请检查（需10位以上字母数字）', 3000); return; }
                    } else { localStorage.removeItem(API_KEY_KEY);
                        showToast('已切换为默认密钥', 1500); }
                    updateKeyStatusUI();
                    closeCustomModal();
                    fetchLunarData();
                    // 保存后立即重新渲染以应用新字体
                    renderSites();
                });
                document.getElementById('resetCustomBtn').addEventListener('click', function() {
                    if (confirm('确定恢复默认样式吗？（API密钥不受影响）')) { resetCustomStyle();
                        closeCustomModal();
                        renderSites(); }
                });
                document.getElementById('resetApiKeyBtn').addEventListener('click', function() {
                    if (confirm('确定重置API密钥为默认密钥吗？')) { resetApiKey(); }
                });
                document.getElementById('customBgColor').addEventListener('input', function() {
                    document.getElementById('customBgColorText').value = this.value;
                });
                document.getElementById('customBgColorText').addEventListener('input', function() {
                    document.getElementById('customBgColor').value = this.value;
                });
                document.getElementById('customTextColor').addEventListener('input', function() {
                    document.getElementById('customTextColorText').value = this.value;
                });
                document.getElementById('customTextColorText').addEventListener('input', function() {
                    document.getElementById('customTextColor').value = this.value;
                });
                document.getElementById('editableTitle').addEventListener('dblclick', function() {
                    const current = this.textContent;
                    const newTitle = prompt('请输入"投标"部分的自定义名称（将显示为"XXX·导航"）', current);
                    if (newTitle !== null && newTitle.trim() !== '') {
                        saveTitle(newTitle.trim());
                        const custom = loadCustomStyle();
                        custom.title = newTitle.trim();
                        saveCustomStyle(custom);
                        showToast('标题已更新', 1500);
                    }
                });
                document.getElementById('calcDateBtn').addEventListener('click', calcDate);
                document.getElementById('clearDateBtn').addEventListener('click', clearDateFields);
                document.querySelectorAll('#startDate, #endDate, #diffDays').forEach(el => {
                    el.addEventListener('keypress', function(e) { if (e.key === 'Enter') calcDate(); });
                });
                document.getElementById('dateArea').addEventListener('click', showCalendar);
                document.getElementById('closeCalendarBtn').addEventListener('click', closeCalendar);
                window.addEventListener('click', function(e) {
                    if (e.target === document.getElementById('editModal')) closeEditModal();
                    if (e.target === document.getElementById('manageTagsModal')) document.getElementById(
                        'manageTagsModal').style.display = 'none';
                    if (e.target === document.getElementById('customModal')) closeCustomModal();
                    if (e.target === document.getElementById('calendarModal')) closeCalendar();
                });
                document.getElementById('openAddSiteModalBtn').addEventListener('click', openAddModal);
                document.getElementById('closeModalBtn').addEventListener('click', closeAddModal);
                document.getElementById('modalAddSiteBtn').addEventListener('click', addSiteFromModal);
                document.getElementById('closeEditModalBtn').addEventListener('click', closeEditModal);
                document.getElementById('saveEditBtn').addEventListener('click', saveEdit);
                document.getElementById('importFileInput').addEventListener('change', e => { if (e.target.files
                        .length) handleImport(e.target.files[0]);
                    e.target.value = ''; });
                document.getElementById('clearAllSitesBtn').addEventListener('click', clearAllSites);
                document.getElementById('backupToCloudBtn').addEventListener('click', backupToCloud);
                document.getElementById('restoreFromCloudBtn').addEventListener('click', restoreFromCloud);
                document.getElementById('genRandomKeyBtn').addEventListener('click', generateRandomKey);
                document.getElementById('backupToLocalBtn').addEventListener('click', backupToLocal);
                document.getElementById('restoreFromLocalBtn').addEventListener('click', triggerLocalRestore);
                document.getElementById('localRestoreFile').addEventListener('change', e => { if (e.target.files
                        .length) handleLocalRestore(e.target.files[0]);
                    e.target.value = ''; });
                document.getElementById('manageTagsBtn').addEventListener('click', showManageTags);
                document.getElementById('closeManageTagsBtn').addEventListener('click', () => document.getElementById(
                    'manageTagsModal').style.display = 'none');
                const editBtn = document.getElementById('editModeBtn');
                const delBtn = document.getElementById('deleteModeBtn');
                editBtn.addEventListener('click', () => { if (editMode) exitEditMode(); else enterEditMode(); });
                delBtn.addEventListener('click', () => { if (deleteMode) { if (selectedIds.size > 0)
                        confirmDeleteSelected(); else exitDeleteMode(true); } else enterDeleteMode(); });
                const sortByName = document.getElementById('sortByNameBtn');
                const sortByFreq = document.getElementById('sortByFreqBtn');
                sortByName.addEventListener('click', () => { currentSort = 'name';
                    sortByName.classList.add('active');
                    sortByFreq.classList.remove('active');
                    clearSearch(); });
                sortByFreq.addEventListener('click', () => { currentSort = 'frequency';
                    sortByFreq.classList.add('active');
                    sortByName.classList.remove('active');
                    clearSearch(); });
                if (currentSort === 'frequency') { sortByFreq.classList.add('active');
                    sortByName.classList.remove('active'); } else { sortByName.classList.add('active');
                    sortByFreq.classList.remove('active'); }
                const searchInput = document.getElementById('globalSearchInput');
                searchInput.addEventListener('input', handleGlobalSearchInput);
                searchInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        const keyword = searchInput.value.trim();
                        if (keyword) { if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
                            performWebSearch(keyword); }
                    }
                });
                document.getElementById('engineSearchBtn').addEventListener('click', () => {
                    const keyword = searchInput.value.trim();
                    if (keyword) { if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
                        performWebSearch(keyword); } else showToast('请输入搜索词', 1000);
                });
                document.getElementById('emailSelect').addEventListener('change', function() {
                    const url = this.value;
                    if (url) { window.open(url, '_blank');
                        this.value = ''; }
                });
                // 智能粘贴监听
                const urlInput = document.getElementById('modalAddUrl');
                const nameInput = document.getElementById('modalAddName');
                if (urlInput) {
                    urlInput.addEventListener('paste', function(e) {
                        const pastedText = (e.clipboardData || window.clipboardData).getData('text');
                        if (!pastedText) return;
                        const parsed = parseTitleUrl(pastedText);
                        if (parsed.url) {
                            this.value = parsed.url;
                            if (!nameInput.value.trim()) { nameInput.value = parsed.title;
                                showToast('✅ 已自动分离标题和网址', 1500); } else { showToast('✅ 已提取网址',
                                1200); }
                            this.dispatchEvent(new Event('input'));
                        } else { showToast('未检测到有效网址，请手动输入', 1500); }
                        e.preventDefault();
                    });
                }
            }

            // 启动
            (async function init() {
                await initData();
                bindEvents();
                sortSitesBy(currentSort);
                renderTagBar();
                renderSites();
            })();
        })();
    </script>
</body>
</html>
